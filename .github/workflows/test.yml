name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kaufland-bons:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container-Test gegen Paperless-Nachbau
        run: ./tests/container_test.sh kaufland-bons:ci
