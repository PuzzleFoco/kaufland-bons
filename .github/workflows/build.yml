name: build

on:
  push:
    # develop bauen, damit PRs dort ein ziehbares Testimage haben;
    # `latest` bekommt nur der Default-Branch (siehe metadata-action unten).
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # Release + Template-Asset
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: name
        name: Image-Name (GHCR verlangt Kleinbuchstaben)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Unraid ist x86_64. Fuer arm64 (Pi o.ae.) hier ergaenzen:
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Unraid-Templates rendern
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          mkdir -p dist
          for name in kaufland-bons kaufland-bons-login; do
            sed "s|__IMAGE__|${IMAGE}:latest|g" "unraid/$name.xml" > "dist/$name.xml"
            grep -q "<Repository>${IMAGE}:latest</Repository>" "dist/$name.xml"
          done
          # Login-Template muss den Einmal-Modus starten
          grep -q "<PostArgs>login-web</PostArgs>" dist/kaufland-bons-login.xml

      - uses: actions/upload-artifact@v4
        with:
          name: unraid-templates
          path: dist/*.xml

      - name: Release mit Template-Asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          notes="Image: ${IMAGE}:${GITHUB_REF_NAME} (auch latest)

          Unraid: kaufland-bons.xml herunterladen und unter Docker -> Template hinzufuegen einlesen."
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "kaufland-bons ${GITHUB_REF_NAME}" --notes "$notes"
          gh release upload "${GITHUB_REF_NAME}" dist/kaufland-bons.xml dist/kaufland-bons-login.xml --clobber
