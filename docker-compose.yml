services:
  kaufland-bons:
    image: ghcr.io/puzzlefoco/kaufland-bons:latest
    build: .            # Fallback: `docker compose build` baut lokal
    container_name: kaufland-bons
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PUID: "99"
      PGID: "100"
      RUN_AT: "04:30"
      RUN_ON_START: "true"
      KAUFLAND_EXPORT: "true"
      KAUFLAND_EXPORT_ARGS: ""          # leer = Voll-Export beim ersten Lauf, danach inkrementell
      PAPERLESS_MODE: "api"              # api | consume | off
      PAPERLESS_URL: "http://192.168.1.10:8000"
      PAPERLESS_TOKEN: "${PAPERLESS_TOKEN}"
      PAPERLESS_CORRESPONDENT: "Kaufland"
      PAPERLESS_DOCUMENT_TYPE: "Kassenbon"
      PAPERLESS_TAGS: "kaufland,bon"
      PAPERLESS_PUSH: "true"
      NOTIFY_URL: ""                     # optional: HA-Webhook oder ntfy
    volumes:
      - ./appdata:/config               # auth.json, pushed.json, status.json
      - /mnt/user/documents/kaufland:/receipts
      - /mnt/user/documents/kaufland-import:/import
      # consume-Modus: - /mnt/user/paperless/consume:/consume
    healthcheck:
      test: ["CMD", "python", "/app/runner.py", "health"]
      interval: 6h
      timeout: 10s
      retries: 2

  # Einmal-Login im Browser (noVNC). Nicht dauerhaft laufen lassen:
  #   docker compose --profile login up login
  #   http://<nas>:6080/vnc.html  -> Login/2FA eintippen -> Container beendet sich
  login:
    image: ghcr.io/puzzlefoco/kaufland-bons:latest
    container_name: kaufland-bons-login
    profiles: ["login"]
    restart: "no"
    ports:
      - "6080:6080"
    environment:
      TZ: Europe/Berlin
      PUID: "99"
      PGID: "100"
      VNC_PASSWORD: "${VNC_PASSWORD:-}"   # leer = Zufallspasswort in ./appdata/vnc-password.txt
    volumes:
      - ./appdata:/config
    command: ["login-web"]
